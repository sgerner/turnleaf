version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: swift
    directory: /ios/App/CapApp-SPM
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Managed by @capacitor/ios via `npm run ios:sync`.
      - dependency-name: '*capacitor-swift-pm*'
