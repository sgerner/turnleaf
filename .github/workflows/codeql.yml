name: CodeQL

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: 17 3 * * 1
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: swift
            build-mode: manual

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: matrix.language == 'java-kotlin' || matrix.language == 'swift'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install dependencies
        if: matrix.language == 'java-kotlin'
        run: npm ci

      - name: Build web app
        if: matrix.language == 'java-kotlin'
        run: npm run build

      - name: Sync Capacitor Android
        if: matrix.language == 'java-kotlin'
        run: npx cap sync android

      - name: Cache SwiftPM packages
        if: matrix.language == 'swift'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/turnleaf-spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'package-lock.json') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Prepare iOS project and prebuild SwiftPM dependencies
        if: matrix.language == 'swift'
        run: |
          npm ci
          npm run ios:simulator
          rm -rf ios/App/DerivedData/Build/Intermediates.noindex/App.build \
            ios/App/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          find ios/App/App -name '*.swift' -exec touch {} +

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Compile Android debug Java
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: ./gradlew :app:compileDebugJavaWithJavac --no-daemon

      - name: Build iOS Simulator target for CodeQL
        if: matrix.language == 'swift'
        env:
          TURNLEAF_SKIP_IOS_SYNC: 'true'
        run: npm run ios:simulator

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
