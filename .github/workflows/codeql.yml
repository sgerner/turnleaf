name: CodeQL

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: 17 3 * * 1
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: java-kotlin
            build-mode: none
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            runner: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js for Swift build
        if: matrix.language == 'swift'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache SwiftPM packages
        if: matrix.language == 'swift'
        uses: actions/cache@v6
        with:
          path: ~/.cache/turnleaf-spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'package-lock.json') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Prepare web assets and dependencies for Swift build
        if: matrix.language == 'swift'
        run: |
          npm ci
          npm run build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build iOS Simulator target for CodeQL
        if: matrix.language == 'swift'
        env:
          TURNLEAF_REUSE_WEB_BUILD: 'true'
          TURNLEAF_XCODE_CLEAN: 'true'
        run: npm run ios:simulator

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
