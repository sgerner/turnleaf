name: Android APK Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: android-apk-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-release-apk:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      TESTED_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      already_released: ${{ steps.release_preflight.outputs.already_released }}
      release_tag: ${{ steps.release_version.outputs.release_tag }}
      version_base: ${{ steps.release_version.outputs.version_base }}
      tested_revision: ${{ steps.release_version.outputs.tested_revision }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TESTED_REVISION }}

      - name: Confirm release revision is current master
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_REVISION: ${{ env.TESTED_REVISION }}
        run: |
          set -eu
          CURRENT_MASTER="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          if [ "$CURRENT_MASTER" != "$TESTED_REVISION" ]; then
            echo "The tested revision is no longer current on master; refusing to build a release." >&2
            exit 1
          fi

      - name: Check for existing release
        id: release_preflight
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_REVISION: ${{ env.TESTED_REVISION }}
        run: node scripts/github-release.mjs preflight

      - name: Set up Node.js
        if: steps.release_preflight.outputs.already_released != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        if: steps.release_preflight.outputs.already_released != 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        if: steps.release_preflight.outputs.already_released != 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install dependencies
        if: steps.release_preflight.outputs.already_released != 'true'
        run: npm ci

      - name: Derive release version
        if: steps.release_preflight.outputs.already_released != 'true'
        id: release_version
        run: |
          set -eu
          BASE_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_VERSION="${BASE_VERSION}+${GITHUB_RUN_NUMBER}"
          echo "TURNLEAF_VERSION_BASE=${BASE_VERSION}" >> "$GITHUB_ENV"
          echo "TURNLEAF_VERSION_NAME=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          echo "TURNLEAF_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "TURNLEAF_RELEASE_TAG=v${RELEASE_VERSION}" >> "$GITHUB_ENV"
          echo "release_tag=v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_base=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tested_revision=${TESTED_REVISION}" >> "$GITHUB_OUTPUT"

      - name: Finalize release notes
        if: steps.release_preflight.outputs.already_released != 'true'
        run: npm run release:finalize

      - name: Run release quality gates
        if: steps.release_preflight.outputs.already_released != 'true'
        run: npm run verify

      - name: Build debug APK for manual release journey
        if: steps.release_preflight.outputs.already_released != 'true' && github.event_name == 'workflow_dispatch'
        env:
          TURNLEAF_REUSE_WEB_BUILD: 'true'
        run: npm run android:debug

      - name: Enable emulator hardware acceleration for manual journey
        if: steps.release_preflight.outputs.already_released != 'true' && github.event_name == 'workflow_dispatch'
        run: |
          if [ -c /dev/kvm ]; then
            sudo chgrp "$(id -gn)" /dev/kvm
            sudo chmod g+rw /dev/kvm
          fi

      - name: Verify manually dispatched revision with reading journey
        if: steps.release_preflight.outputs.already_released != 'true' && github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          force-avd-creation: true
          emulator-boot-timeout: 900
          disable-animations: true
          script: npm run android:journey

      - name: Confirm release revision is current before signing
        if: steps.release_preflight.outputs.already_released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_REVISION: ${{ env.TESTED_REVISION }}
        run: |
          set -eu
          CURRENT_MASTER="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          if [ "$CURRENT_MASTER" != "$TESTED_REVISION" ]; then
            echo "Master moved during release verification; refusing to sign an outdated APK." >&2
            exit 1
          fi

      - name: Restore signing key
        if: steps.release_preflight.outputs.already_released != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "Missing ANDROID_KEYSTORE_PASSWORD secret" >&2
            exit 1
          fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "Missing ANDROID_KEY_ALIAS secret" >&2
            exit 1
          fi
          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Missing ANDROID_KEY_PASSWORD secret" >&2
            exit 1
          fi
          base64 --decode <<<"$ANDROID_KEYSTORE_BASE64" > android/turnleaf-release.jks
          cat > android/keystore.properties <<EOF
          TURNLEAF_STORE_FILE=turnleaf-release.jks
          TURNLEAF_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          TURNLEAF_KEY_ALIAS=$ANDROID_KEY_ALIAS
          TURNLEAF_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed release APK
        if: steps.release_preflight.outputs.already_released != 'true'
        env:
          TURNLEAF_REUSE_WEB_BUILD: 'true'
        run: npm run android:release

      - name: Enable emulator hardware acceleration for signed APK smoke test
        if: steps.release_preflight.outputs.already_released != 'true'
        run: |
          if [ -c /dev/kvm ]; then
            sudo chgrp "$(id -gn)" /dev/kvm
            sudo chmod g+rw /dev/kvm
          fi

      - name: Smoke-test signed release APK
        if: steps.release_preflight.outputs.already_released != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_PACKAGE_NAME: app.turnleaf.reader
          ANDROID_APK_PATH: android/app/build/outputs/apk/release/app-release.apk
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          force-avd-creation: true
          emulator-boot-timeout: 900
          disable-animations: true
          script: npm run android:smoke

      - name: Stage release artifacts and notes
        if: steps.release_preflight.outputs.already_released != 'true'
        env:
          TESTED_REVISION: ${{ steps.release_version.outputs.tested_revision }}
        run: |
          set -eu
          mkdir -p release-payload
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          npm run --silent release:notes > "$RUNNER_TEMP/turnleaf-release-notes.md"
          {
            cat "$RUNNER_TEMP/turnleaf-release-notes.md"
            printf '\n\nTested revision: `%s`\n' "$TESTED_REVISION"
          } > release-payload/turnleaf-release-notes.md
          cp "$APK" release-payload/app-release.apk
          (cd release-payload && sha256sum app-release.apk > app-release.apk.sha256)
          printf '%s\n' "$TESTED_REVISION" > release-payload/tested-revision.txt

      - name: Upload release artifacts
        if: steps.release_preflight.outputs.already_released != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turnleaf-release
          path: release-payload
          if-no-files-found: error

  publish-github-release:
    needs: build-release-apk
    if: needs.build-release-apk.outputs.already_released != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-release-apk.outputs.tested_revision }}
          persist-credentials: false
          sparse-checkout: |
            scripts/github-release.mjs
          sparse-checkout-cone-mode: false

      - name: Download tested release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: turnleaf-release
          path: release-payload

      - name: Verify release provenance
        env:
          TESTED_REVISION: ${{ needs.build-release-apk.outputs.tested_revision }}
        run: |
          set -eu
          test "$(cat release-payload/tested-revision.txt)" = "$TESTED_REVISION"
          grep -Fq "Tested revision: \`$TESTED_REVISION\`" release-payload/turnleaf-release-notes.md
          test -s release-payload/app-release.apk
          test -s release-payload/turnleaf-release-notes.md
          (cd release-payload && sha256sum --check app-release.apk.sha256)

      - name: Confirm release revision is still current master
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_REVISION: ${{ needs.build-release-apk.outputs.tested_revision }}
        run: |
          set -eu
          CURRENT_MASTER="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          if [ "$CURRENT_MASTER" != "$TESTED_REVISION" ]; then
            echo "Master moved before publication; refusing to publish an outdated APK." >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-release-apk.outputs.release_tag }}
          VERSION_BASE: ${{ needs.build-release-apk.outputs.version_base }}
          TESTED_REVISION: ${{ needs.build-release-apk.outputs.tested_revision }}
        run: node scripts/github-release.mjs publish
