name: Android APK Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: android-apk-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-release-apk:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TESTED_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      already_released: ${{ steps.release_preflight.outputs.already_released }}
      release_tag: ${{ steps.release_version.outputs.release_tag }}
      version_base: ${{ steps.release_version.outputs.version_base }}
      tested_revision: ${{ steps.release_version.outputs.tested_revision }}
      apk_sha256: ${{ steps.stage_release.outputs.apk_sha256 }}
      notes_sha256: ${{ steps.stage_release.outputs.notes_sha256 }}
      min_sdk_version: ${{ steps.stage_release.outputs.min_sdk_version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TESTED_REVISION }}

      - name: Confirm release revision is current master
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_REVISION: ${{ env.TESTED_REVISION }}
        run: |
          set -eu
          CURRENT_MASTER="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          if [ "$CURRENT_MASTER" != "$TESTED_REVISION" ]; then
            echo "The tested revision is no longer current on master; refusing to build a release." >&2
            exit 1
          fi

      - name: Check for existing release
        id: release_preflight
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_REVISION: ${{ env.TESTED_REVISION }}
        run: node scripts/github-release.mjs preflight

      - name: Set up Node.js
        if: steps.release_preflight.outputs.already_released != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        if: steps.release_preflight.outputs.already_released != 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        if: steps.release_preflight.outputs.already_released != 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install dependencies
        if: steps.release_preflight.outputs.already_released != 'true'
        run: npm ci

      - name: Derive release version
        if: steps.release_preflight.outputs.already_released != 'true'
        id: release_version
        run: |
          set -eu
          BASE_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_VERSION="${BASE_VERSION}+${GITHUB_RUN_NUMBER}"
          echo "TURNLEAF_VERSION_BASE=${BASE_VERSION}" >> "$GITHUB_ENV"
          echo "TURNLEAF_VERSION_NAME=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          echo "TURNLEAF_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "TURNLEAF_RELEASE_TAG=v${RELEASE_VERSION}" >> "$GITHUB_ENV"
          echo "release_tag=v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_base=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tested_revision=${TESTED_REVISION}" >> "$GITHUB_OUTPUT"

      - name: Finalize release notes
        if: steps.release_preflight.outputs.already_released != 'true'
        run: npm run release:finalize

      - name: Run release quality gates
        if: steps.release_preflight.outputs.already_released != 'true'
        run: npm run verify

      - name: Build debug APK for manual release journey
        if: steps.release_preflight.outputs.already_released != 'true' && github.event_name == 'workflow_dispatch'
        env:
          TURNLEAF_REUSE_WEB_BUILD: 'true'
        run: npm run android:debug

      - name: Enable emulator hardware acceleration
        if: steps.release_preflight.outputs.already_released != 'true'
        run: |
          if [ -c /dev/kvm ]; then
            sudo chgrp "$(id -gn)" /dev/kvm
            sudo chmod g+rw /dev/kvm
          fi

      - name: Cache Android AVD snapshot
        if: steps.release_preflight.outputs.already_released != 'true'
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api-36-google_apis-x86_64-pixel_6-v1

      - name: Create AVD and generate snapshot for caching
        if: steps.release_preflight.outputs.already_released != 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          force-avd-creation: true
          emulator-boot-timeout: 900
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Verify manually dispatched revision with reading journey
        if: steps.release_preflight.outputs.already_released != 'true' && github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -no-audio -no-boot-anim
          force-avd-creation: false
          emulator-boot-timeout: 900
          disable-animations: true
          script: npm run android:journey

      - name: Confirm release revision is current before signing
        if: steps.release_preflight.outputs.already_released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_REVISION: ${{ env.TESTED_REVISION }}
        run: |
          set -eu
          CURRENT_MASTER="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          if [ "$CURRENT_MASTER" != "$TESTED_REVISION" ]; then
            echo "Master moved during release verification; refusing to sign an outdated APK." >&2
            exit 1
          fi

      - name: Restore signing key
        if: steps.release_preflight.outputs.already_released != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          umask 077
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/turnleaf-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "Decoded keystore at $KEYSTORE_PATH is empty" >&2
            exit 1
          fi

      - name: Build signed release APK
        if: steps.release_preflight.outputs.already_released != 'true'
        env:
          TURNLEAF_REUSE_WEB_BUILD: 'true'
          TURNLEAF_STORE_FILE: ${{ runner.temp }}/turnleaf-release.jks
          TURNLEAF_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TURNLEAF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TURNLEAF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:release -- --no-daemon

      - name: Clean up signing files
        if: always()
        run: |
          set -eu
          for signing_file in "$RUNNER_TEMP/turnleaf-release.jks" "android/turnleaf-release.jks" "android/keystore.properties"; do
            if [ -f "$signing_file" ]; then
              shred -u "$signing_file" || rm -f "$signing_file"
            else
              rm -f "$signing_file"
            fi
          done

      - name: Smoke-test signed release APK
        if: steps.release_preflight.outputs.already_released != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_PACKAGE_NAME: app.turnleaf.reader
          ANDROID_APK_PATH: android/app/build/outputs/apk/release/app-release.apk
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -no-audio -no-boot-anim
          force-avd-creation: false
          emulator-boot-timeout: 900
          disable-animations: true
          script: npm run android:smoke

      - name: Stage release artifacts and notes
        if: steps.release_preflight.outputs.already_released != 'true'
        id: stage_release
        env:
          TESTED_REVISION: ${{ steps.release_version.outputs.tested_revision }}
        run: |
          set -eu
          mkdir -p release-payload
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          npm run --silent release:notes > "$RUNNER_TEMP/turnleaf-release-notes.md"
          {
            cat "$RUNNER_TEMP/turnleaf-release-notes.md"
            printf '\n\nTested revision: `%s`\n' "$TESTED_REVISION"
          } > release-payload/turnleaf-release-notes.md
          cp "$APK" release-payload/app-release.apk
          (cd release-payload && sha256sum app-release.apk > app-release.apk.sha256)
          printf '%s\n' "$TESTED_REVISION" > release-payload/tested-revision.txt
          npm run android:verify-release -- release-payload/app-release.apk
          MIN_SDK_VERSION="$(sed -n 's/^[[:space:]]*minSdkVersion[[:space:]]*=[[:space:]]*\([0-9][0-9]*\)[[:space:]]*$/\1/p' android/variables.gradle)"
          APK_SHA256="$(sha256sum release-payload/app-release.apk | awk '{print $1}')"
          NOTES_SHA256="$(sha256sum release-payload/turnleaf-release-notes.md | awk '{print $1}')"
          test -n "$MIN_SDK_VERSION"
          test "${#APK_SHA256}" -eq 64
          test "${#NOTES_SHA256}" -eq 64
          echo "apk_sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"
          echo "notes_sha256=${NOTES_SHA256}" >> "$GITHUB_OUTPUT"
          echo "min_sdk_version=${MIN_SDK_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Attest release APK build provenance
        if: steps.release_preflight.outputs.already_released != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-payload/app-release.apk

      - name: Upload release artifacts
        if: steps.release_preflight.outputs.already_released != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turnleaf-release
          path: release-payload
          if-no-files-found: error
          retention-days: 1

  publish-github-release:
    needs: build-release-apk
    if: needs.build-release-apk.outputs.already_released != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read

    steps:
      - name: Check out release helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-release-apk.outputs.tested_revision }}
          persist-credentials: false
          sparse-checkout: |
            scripts/github-release.mjs
          sparse-checkout-cone-mode: false

      - name: Download tested release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: turnleaf-release
          path: release-payload

      - name: Verify release provenance
        env:
          TESTED_REVISION: ${{ needs.build-release-apk.outputs.tested_revision }}
          EXPECTED_APK_SHA256: ${{ needs.build-release-apk.outputs.apk_sha256 }}
          EXPECTED_NOTES_SHA256: ${{ needs.build-release-apk.outputs.notes_sha256 }}
          MIN_SDK_VERSION: ${{ needs.build-release-apk.outputs.min_sdk_version }}
        run: |
          set -eu
          if [ -z "${TESTED_REVISION:-}" ] || [ -z "${EXPECTED_APK_SHA256:-}" ] || [ -z "${EXPECTED_NOTES_SHA256:-}" ] || [ -z "${MIN_SDK_VERSION:-}" ]; then
            echo "Missing required provenance outputs from build-release-apk." >&2
            exit 1
          fi
          case "$EXPECTED_APK_SHA256" in
            *[!0-9a-f]*) echo "Invalid apk_sha256 output." >&2; exit 1 ;;
          esac
          test "${#EXPECTED_APK_SHA256}" -eq 64
          case "$EXPECTED_NOTES_SHA256" in
            *[!0-9a-f]*) echo "Invalid notes_sha256 output." >&2; exit 1 ;;
          esac
          test "${#EXPECTED_NOTES_SHA256}" -eq 64
          case "$MIN_SDK_VERSION" in
            *[!0-9]*) echo "Invalid min_sdk_version output." >&2; exit 1 ;;
          esac
          test "$(cat release-payload/tested-revision.txt)" = "$TESTED_REVISION"
          grep -Fq "Tested revision: \`$TESTED_REVISION\`" release-payload/turnleaf-release-notes.md
          test -s release-payload/app-release.apk
          test -s release-payload/turnleaf-release-notes.md
          (cd release-payload && sha256sum --check app-release.apk.sha256)
          test "$(cat release-payload/app-release.apk.sha256)" = "${EXPECTED_APK_SHA256}  app-release.apk"
          ACTUAL_APK_SHA256="$(sha256sum release-payload/app-release.apk | awk '{print $1}')"
          ACTUAL_NOTES_SHA256="$(sha256sum release-payload/turnleaf-release-notes.md | awk '{print $1}')"
          if [ "$ACTUAL_APK_SHA256" != "$EXPECTED_APK_SHA256" ]; then
            echo "APK SHA-256 digest mismatch: expected $EXPECTED_APK_SHA256, got $ACTUAL_APK_SHA256" >&2
            exit 1
          fi
          if [ "$ACTUAL_NOTES_SHA256" != "$EXPECTED_NOTES_SHA256" ]; then
            echo "Release notes SHA-256 digest mismatch: expected $EXPECTED_NOTES_SHA256, got $ACTUAL_NOTES_SHA256" >&2
            exit 1
          fi
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR="${SDK_ROOT}/build-tools"
          if [ ! -d "$BUILD_TOOLS_DIR" ]; then
            echo "Android SDK build-tools directory not found at $BUILD_TOOLS_DIR" >&2
            exit 1
          fi
          CANDIDATES="$(find "$BUILD_TOOLS_DIR" -mindepth 2 -maxdepth 2 -name apksigner -print | sort -Vr)"
          APKSIGNER=""
          while IFS= read -r candidate; do
            if [ -n "$candidate" ] && [ -f "$candidate" ] && [ -x "$candidate" ]; then
              APKSIGNER="$candidate"
              break
            fi
          done <<<"$CANDIDATES"
          if [ -z "$APKSIGNER" ]; then
            echo "No executable apksigner binary found under $BUILD_TOOLS_DIR" >&2
            exit 1
          fi
          "$APKSIGNER" verify --min-sdk-version "$MIN_SDK_VERSION" --print-certs release-payload/app-release.apk

      - name: Verify APK provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ATTEMPT=1
          MAX_ATTEMPTS=3
          until gh attestation verify "release-payload/app-release.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/android-release.yml" \
            --deny-self-hosted-runners; do
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "APK provenance attestation verification failed after ${MAX_ATTEMPTS} attempts." >&2
              exit 1
            fi
            echo "Attestation verification attempt ${ATTEMPT} failed; retrying in 5 seconds..." >&2
            ATTEMPT=$((ATTEMPT + 1))
            sleep 5
          done

      - name: Confirm release revision is still current master
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_REVISION: ${{ needs.build-release-apk.outputs.tested_revision }}
        run: |
          set -eu
          CURRENT_MASTER="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          if [ "$CURRENT_MASTER" != "$TESTED_REVISION" ]; then
            echo "Master moved before publication; refusing to publish an outdated APK." >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-release-apk.outputs.release_tag }}
          VERSION_BASE: ${{ needs.build-release-apk.outputs.version_base }}
          TESTED_REVISION: ${{ needs.build-release-apk.outputs.tested_revision }}
        run: node scripts/github-release.mjs publish
